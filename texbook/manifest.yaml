# manifest.yaml -- order of the book
#
# Format (deliberately simple, read by tools/merge_tex.py without PyYAML):
#
#   - part: <part title>          starts a new \part
#   - file: <name>.tex            source file, relative to --src
#     title: <chapter title>      optional; falls back to the \title{} of the file
#     slug:  <label-prefix>       optional; falls back to the file name
#
# Filenames below are my best guess from our previous sessions -- rename the
# `file:` values to whatever your files are actually called. Any entry whose
# file is missing is skipped and reported at the end of the run, so you can
# start with a subset and grow the book.
#
# Selection rules already applied:
#   * thyristor gate driver: only the latest version is listed (one entry)
#   * where an English and an Italian version exist, the English one is listed
#   * documents that only ever existed in Italian are marked  [IT]  below;
#     they compile fine, they are just not in English yet

